[package]
name = "skill-panel-next"
version = "0.1.0"
description = "Skill Panel Next desktop core"
authors = ["Skill Panel contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "skill_panel_next_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "skill-panel-next"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
