name: CI

on:
  push:
    branches:
      - main
      - develop
      - cursor/ui
      - codex/core
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run lint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - name: Set up stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Check Rust formatting
        run: npm run rust:fmt
      - name: Run clippy
        run: npm run rust:clippy
      - name: Run Rust tests
        run: npm run cargo:test

  production-smoke:
    name: Production Playwright smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run production smoke
        run: npm run test:e2e

  frozen-prototype:
    name: Frozen prototype 20-suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Install frozen dependencies
        run: npm ci --prefix prototype
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frozen prototype suite
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/prototype-playwright-locale.cjs
        run: |
          python3 -m http.server 8081 \
            --bind 127.0.0.1 \
            --directory prototype \
            > /tmp/skill-panel-prototype-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/index.html > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8081/index.html > /dev/null
          npm run test:prototype
