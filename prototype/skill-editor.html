<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Editor · Skill Panel</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    /* Phase E Editor — page-local layout grid only */
    .main.sp-editor-main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      background: var(--bg);
    }
    .sp-editor-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 340px;
      min-height: 0;
      overflow: hidden;
    }
    .sp-editor-pane-tree,
    .sp-editor-pane-center,
    .sp-editor-pane-right {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }
    .sp-editor-pane-tree {
      border-right: 1px solid var(--border-soft);
      background: var(--surface-warm);
    }
    .sp-editor-pane-center {
      border-right: 1px solid var(--border-soft);
    }
    .sp-editor-pane-right {
      background: var(--surface-warm);
    }
    .sp-editor-pane-body {
      min-height: 0;
      overflow: auto;
    }
    #editor-wrap {
      display: grid;
      grid-template-columns: auto 1fr;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }
    #editor-wrap.binary-mode {
      grid-template-columns: 1fr;
    }
    #editor-wrap.binary-mode #line-numbers,
    #editor-wrap.binary-mode #editor {
      display: none;
    }
    #line-numbers {
      overflow: hidden;
      padding: 12px 8px 12px 12px;
      text-align: right;
      user-select: none;
      border-right: 1px solid var(--border-soft);
      background: var(--surface-warm);
      min-width: 36px;
    }
    #editor {
      width: 100%;
      height: 100%;
      border: 0;
      resize: none;
      padding: 12px 14px;
      background: transparent;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.55;
      outline: none;
      tab-size: 2;
    }
    #editor:disabled {
      color: var(--fg-2);
      cursor: default;
      opacity: 0.92;
    }
    #binary-panel {
      display: none;
      padding: 18px 16px;
      overflow: auto;
    }
    #editor-wrap.binary-mode #binary-panel {
      display: block;
    }
    .sp-editor-right-tabs {
      display: flex;
      gap: 2px;
      padding: 0 8px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface-warm);
      overflow-x: auto;
    }
    .sp-editor-right-tabs button {
      border: 0;
      background: transparent;
      padding: 10px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
    }
    .sp-editor-right-tabs button.active {
      color: var(--fg);
      font-weight: 600;
      border-bottom-color: var(--fg);
    }
    .sp-editor-tab-panel {
      display: none;
      padding: 14px;
      min-height: 0;
    }
    .sp-editor-tab-panel.active { display: block; }
    .sp-editor-preview {
      font-size: 14px;
      line-height: 1.55;
      color: var(--fg-2);
    }
    .sp-editor-preview h1,
    .sp-editor-preview h2,
    .sp-editor-preview h3 { color: var(--fg); margin: 12px 0 6px; }
    .sp-editor-preview h1 { font-size: 20px; }
    .sp-editor-preview h2 { font-size: 16px; }
    .sp-editor-preview h3 { font-size: 14px; }
    .sp-editor-preview p { margin-bottom: 8px; }
    .sp-editor-preview ul,
    .sp-editor-preview ol { margin: 0 0 10px 18px; }
    .sp-editor-preview li { margin: 3px 0; }
    .sp-editor-preview code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--surface);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .sp-editor-preview pre {
      background: var(--surface);
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .sp-editor-structure h4,
    .sp-editor-meta h4,
    .sp-editor-problems h4 {
      font-size: 11px;
      font-weight: 600;
      color: var(--meta);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin: 12px 0 6px;
    }
    .sp-editor-structure .row,
    .sp-editor-meta .row,
    .sp-editor-problems .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 13px;
    }
    .sp-editor-structure .row:last-child,
    .sp-editor-meta .row:last-child,
    .sp-editor-problems .row:last-child { border-bottom: 0; }
    .sp-editor-structure .mono,
    .sp-editor-meta .mono { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); word-break: break-word; }
    .sp-editor-problems .row.warn { color: var(--warn-text); }
    .sp-editor-problems .row.danger { color: var(--danger-text); }
    .sp-editor-file-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
    }
    .sp-editor-file-head .path {
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sp-editor-tree-head {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 11px;
      font-weight: 600;
      color: var(--meta);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .sp-editor-empty {
      padding: 24px 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 1100px) {
      .sp-editor-layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }
      .sp-editor-pane-tree,
      .sp-editor-pane-center,
      .sp-editor-pane-right {
        display: none;
        border: 0;
      }
      .sp-editor-layout.show-tree .sp-editor-pane-tree { display: grid; }
      .sp-editor-layout.show-editor .sp-editor-pane-center { display: grid; }
      .sp-editor-layout.show-right .sp-editor-pane-right { display: grid; }
    }
  </style>
</head>
<body>
  <div class="app" data-od-id="app-shell">
    <div class="titlebar">
      <div class="traffic"><i></i><i></i><i></i></div>
      <div class="win-title" data-i18n="app.title">Skill Panel — Editor</div>
      <div class="global-controls" data-global-controls></div>
    </div>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SP</div><div><strong>Skill Panel</strong><span>本地 · v0.1.0-mvp</span></div></div>
        <nav class="nav">
          <div class="nav-label">工作区</div>
          <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H20v14H6.5A2.5 2.5 0 0 0 4 20.5V6.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg><span data-i18n="nav.library">Library</span><span class="count" id="nav-lib-count">0</span></a>
          <a href="insights.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 19V5M4 19h16M8 15v4M12 10v9M16 7v12"/></svg><span data-i18n="nav.insights">Insights</span><span class="count" id="nav-ins-count">0</span></a>
          <a href="activity.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg><span data-i18n="nav.activity">Activity</span><span class="count" id="nav-act-count">0</span></a>
          <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg><span data-i18n="nav.settings">Settings</span></a>
        </nav>
      </aside>

      <div class="main sp-editor-main">
        <header class="sp-editor-header" id="editor-header">
          <a class="btn btn-ghost" id="btn-back" href="index.html">← 返回</a>
          <div class="sp-editor-title">
            <h1 id="skill-name">—</h1>
            <div class="path" id="instance-path">—</div>
          </div>
          <div class="sp-editor-status-row">
            <span class="sd-pill" id="mode-chip"><i class="sp-status-dot"></i><span id="mode-label">—</span></span>
            <span class="sd-pill" id="draft-status"><i class="sp-status-dot"></i><span>无草稿</span></span>
            <span class="sd-pill" id="external-status"><i class="sp-status-dot"></i><span>磁盘已同步</span></span>
            <span class="sd-pill" id="validation-count"><i class="sp-status-dot"></i><span>问题 0</span></span>
          </div>
          <div class="sp-editor-actions">
            <button type="button" class="btn" id="btn-all-diff">查看全部 Diff</button>
            <button type="button" class="btn" id="btn-discard">放弃草稿</button>
            <button type="button" class="btn" id="btn-snapshot">包快照</button>
            <button type="button" class="btn btn-primary" id="btn-apply">应用更改</button>
          </div>
        </header>

        <div class="sp-editor-narrow-tabs" id="narrow-tabs" hidden>
          <button type="button" class="active" data-pane="tree">文件</button>
          <button type="button" data-pane="editor">编辑</button>
          <button type="button" data-pane="right">侧栏</button>
        </div>

        <div class="sp-editor-layout show-editor" id="editor-layout">
          <aside class="sp-editor-pane-tree">
            <div class="sp-editor-tree-head">Package</div>
            <div class="sp-editor-pane-body">
              <div class="sp-file-tree" id="file-tree"></div>
            </div>
          </aside>

          <section class="sp-editor-pane-center">
            <div class="sp-editor-file-head">
              <span class="path" id="current-file-path">选择文件</span>
              <span id="current-file-meta">—</span>
            </div>
            <div id="editor-wrap">
              <div class="sp-linenum" id="line-numbers" aria-hidden="true">1</div>
              <textarea id="editor" spellcheck="false" placeholder="在此编辑文本文件…"></textarea>
              <div id="binary-panel">
                <div class="sp-editor-empty" id="binary-meta">二进制文件仅显示元数据，不可在此编辑。</div>
              </div>
            </div>
          </section>

          <aside class="sp-editor-pane-right">
            <div class="sp-editor-right-tabs" id="right-tabs">
              <button type="button" class="active" data-tab="preview">Preview</button>
              <button type="button" data-tab="structure">Structure</button>
              <button type="button" data-tab="metadata">Metadata</button>
              <button type="button" data-tab="diff">Diff</button>
              <button type="button" data-tab="problems">Problems</button>
            </div>
            <div class="sp-editor-pane-body" id="right-body">
              <div class="sp-editor-tab-panel sp-editor-preview active" id="panel-preview"></div>
              <div class="sp-editor-tab-panel sp-editor-structure" id="panel-structure"></div>
              <div class="sp-editor-tab-panel sp-editor-meta" id="panel-metadata"></div>
              <div class="sp-editor-tab-panel" id="panel-diff"><div class="sp-diff" id="file-diff"></div></div>
              <div class="sp-editor-tab-panel sp-editor-problems" id="panel-problems"></div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="apply-modal">
    <div class="modal wide">
      <header>
        <h3>应用更改</h3>
        <p>确认前会校验草稿与磁盘状态。此原型不会真实写入宿主文件系统。</p>
      </header>
      <div class="body">
        <div id="apply-summary" style="font-size:13px;margin-bottom:10px;color:var(--fg-2)"></div>
        <div class="sp-diff" id="apply-diff"></div>
        <div class="yaml-err" id="apply-error" style="color:var(--danger);font-size:12px;margin-top:8px"></div>
      </div>
      <footer>
        <button type="button" class="btn" id="apply-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="apply-confirm">确认应用</button>
      </footer>
    </div>
  </div>

  <div class="modal-bg" id="discard-modal">
    <div class="modal">
      <header>
        <h3>放弃草稿</h3>
        <p>未应用的更改将丢失。此操作仅影响原型状态中的草稿对象。</p>
      </header>
      <div class="body">
        <div id="discard-summary" style="font-size:13px;color:var(--fg-2)"></div>
      </div>
      <footer>
        <button type="button" class="btn" id="discard-cancel">取消</button>
        <button type="button" class="btn btn-danger" id="discard-confirm">确认放弃</button>
      </footer>
    </div>
  </div>

  <div class="modal-bg" id="all-diff-modal">
    <div class="modal wide">
      <header>
        <h3>全部 Diff</h3>
        <p>当前会话中所有草稿相对磁盘的差异摘要。</p>
      </header>
      <div class="body">
        <div id="all-diff-body"></div>
      </div>
      <footer>
        <button type="button" class="btn" id="all-diff-close">关闭</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="shared.js"></script>
  <script src="skill-editor-app.js"></script>
</body>
</html>
